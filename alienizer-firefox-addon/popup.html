<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #e0e0e0;
      background: #1a1a2e;
    }

    .header {
      padding: 14px 16px 10px;
      text-align: center;
      border-bottom: 1px solid #2a2a4a;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #c8b8ff;
    }

    /* -- Toggle row -- */

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #2a2a4a;
    }

    .toggle-row label {
      font-size: 13px;
      font-weight: 500;
    }

    .switch {
      position: relative;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .switch .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #3a3a5a;
      border-radius: 12px;
      transition: background 0.2s;
    }

    .switch .slider::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      bottom: 3px;
      background: #888;
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }

    .switch input:checked + .slider {
      background: #6c5ce7;
    }

    .switch input:checked + .slider::before {
      transform: translateX(20px);
      background: #fff;
    }

    /* -- Presets -- */

    .presets {
      display: flex;
      gap: 4px;
      padding: 10px 16px;
      border-bottom: 1px solid #2a2a4a;
    }

    .preset-btn {
      flex: 1;
      padding: 6px 2px;
      font-size: 11px;
      border: 1px solid #3a3a5a;
      border-radius: 12px;
      background: transparent;
      color: #aaa;
      cursor: pointer;
      transition: all 0.15s;
    }

    .preset-btn:hover {
      border-color: #6c5ce7;
      color: #ddd;
    }

    .preset-btn.active {
      background: #6c5ce7;
      border-color: #6c5ce7;
      color: #fff;
      font-weight: 600;
    }

    /* -- Details / Advanced -- */

    details {
      border-bottom: 1px solid #2a2a4a;
    }

    summary {
      padding: 10px 16px;
      cursor: pointer;
      font-size: 12px;
      color: #888;
      user-select: none;
    }

    summary:hover { color: #bbb; }

    .advanced-content {
      padding: 0 16px 12px;
    }

    .slider-group {
      margin-bottom: 10px;
    }

    .slider-group .label-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #999;
      margin-bottom: 3px;
    }

    .slider-group .label-row .val {
      color: #c8b8ff;
      font-weight: 600;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: #3a3a5a;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #6c5ce7;
      cursor: pointer;
    }

    .seed-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .seed-row label {
      font-size: 11px;
      color: #999;
      white-space: nowrap;
    }

    .seed-row input {
      flex: 1;
      padding: 4px 8px;
      font-size: 12px;
      border: 1px solid #3a3a5a;
      border-radius: 6px;
      background: #2a2a4a;
      color: #e0e0e0;
      outline: none;
    }

    .seed-row input::placeholder { color: #666; }
    .seed-row input:focus { border-color: #6c5ce7; }

    /* -- Script checkboxes -- */

    .script-section {
      margin-top: 8px;
    }

    .script-section h4 {
      font-size: 11px;
      color: #999;
      margin-bottom: 6px;
    }

    .script-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px 8px;
      max-height: 160px;
      overflow-y: auto;
      font-size: 11px;
    }

    .script-grid label {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 0;
      color: #bbb;
      cursor: pointer;
    }

    .script-grid input[type="checkbox"] {
      accent-color: #6c5ce7;
    }

    .script-group-name {
      grid-column: 1 / -1;
      font-size: 10px;
      color: #666;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* -- Auto-activate section -- */

    .auto-section {
      padding: 10px 16px;
      border-bottom: 1px solid #2a2a4a;
    }

    .auto-section label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      cursor: pointer;
    }

    .auto-section input[type="checkbox"] {
      accent-color: #6c5ce7;
    }

    .auto-hint {
      font-size: 10px;
      color: #666;
      margin-top: 4px;
      padding-left: 24px;
    }

    /* -- Reset link -- */

    .footer {
      padding: 8px 16px 10px;
      text-align: center;
    }

    .footer a {
      font-size: 11px;
      color: #666;
      text-decoration: none;
      cursor: pointer;
    }

    .footer a:hover {
      color: #c8b8ff;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Alienizer</h1>
  </div>

  <div class="toggle-row">
    <label>Aktiv auf dieser Seite</label>
    <div class="switch">
      <input type="checkbox" id="toggle-active">
      <span class="slider"></span>
    </div>
  </div>

  <div class="presets" id="presets">
    <button class="preset-btn" data-preset="sneaky">Sneaky</button>
    <button class="preset-btn" data-preset="subtle">Subtle</button>
    <button class="preset-btn" data-preset="threshold">Threshold</button>
    <button class="preset-btn" data-preset="drastic">Drastic</button>
    <button class="preset-btn" data-preset="total">Total</button>
  </div>

  <details>
    <summary>Erweiterte Einstellungen</summary>
    <div class="advanced-content">
      <div class="slider-group">
        <div class="label-row">
          <span>Replacement Rate</span>
          <span class="val" id="val-rate">50%</span>
        </div>
        <input type="range" id="slider-rate" min="0" max="100" value="50">
      </div>

      <div class="slider-group">
        <div class="label-row">
          <span>Visual Distance</span>
          <span class="val" id="val-visual">0.12</span>
        </div>
        <input type="range" id="slider-visual" min="0" max="30" value="12">
      </div>

      <div class="slider-group">
        <div class="label-row">
          <span>Phonetic Ratio</span>
          <span class="val" id="val-phonetic">20%</span>
        </div>
        <input type="range" id="slider-phonetic" min="0" max="100" value="20">
      </div>

      <div class="seed-row">
        <label>Seed:</label>
        <input type="text" id="seed-input" placeholder="zufällig">
      </div>

      <div class="script-section">
        <h4>Script-Filter</h4>
        <div class="script-grid" id="script-checkboxes"></div>
      </div>
    </div>
  </details>

  <div class="auto-section">
    <label>
      <input type="checkbox" id="auto-activate">
      Automatisch aktivieren
    </label>
    <div class="auto-hint">Alienisiert alle Seiten beim Laden</div>
  </div>

  <div class="footer">
    <a href="#" id="reset-link">Einstellungen zurücksetzen</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
